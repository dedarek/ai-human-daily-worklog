name: Worklog Cloud

on:
  push:
    branches:
      - feat/chatgpt-worklog-mcp
    paths:
      - "cloud/**"
      - ".github/workflows/worklog-cloud.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
