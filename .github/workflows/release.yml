name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: brew install cmake
      - run: npm ci
      - name: Build universal DMG
        id: package
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$KEYCHAIN_PASSWORD" && -n "$SIGN_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" worklog-build.keychain
            security set-keychain-settings -lut 21600 worklog-build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" worklog-build.keychain
            security import certificate.p12 -k worklog-build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s worklog-build.keychain login.keychain-db
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" worklog-build.keychain
            xcrun notarytool store-credentials WorklogNotary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            NOTARY_PROFILE=WorklogNotary npm run release-dmg
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            npm run build-dmg
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: Worklog-universal-dmg
          path: release/*.dmg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-windows
      - shell: pwsh
        run: ./scripts/acceptance-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: Worklog-windows
          path: release/desktop/*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-linux
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libsecret-tools
      - run: ./scripts/acceptance-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Worklog-linux
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [dmg, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.dmg.outputs.signed }}" == "true" ]]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Worklog ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --prerelease --title "Worklog ${GITHUB_REF_NAME} · Cross-platform Preview" --notes $'Worklog now includes macOS, Windows, and Linux desktop builds.\n\nmacOS: the current DMG is not notarized. Drag Worklog into Applications, then right-click and choose Open the first time.\n\nWindows/Linux preview: Agent logs, foreground apps, automatic reports, Feishu, and local Markdown are implemented, and native CI package builds pass. Real-desktop end-to-end validation is still pending for interactive install/uninstall, tray actions, autostart, credential persistence, foreground-window capture, and actual Feishu publishing. Teams system-audio capture remains macOS-only. See docs/COMPATIBILITY.md before treating this release as stable.'
